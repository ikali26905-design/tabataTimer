<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône Tabata Timer : "00:20" façon afficheur de chronomètre moderne.
       Chaque chiffre est dessiné avec des segments arrondis (pas de police),
       donc le rendu est identique sur tous les appareils.
       Le contenu tient dans le cercle central (zone "maskable") pour qu'Android
       puisse découper l'icône en rond sans rien couper. -->
  <defs>
    <!-- Chiffre 0 : segments a, b, c, d, e, f (72 x 140 px) -->
    <g id="d0">
      <rect x="14" y="0"   width="44" height="16" rx="8"/>
      <rect x="56" y="14"  width="16" height="48" rx="8"/>
      <rect x="56" y="78"  width="16" height="48" rx="8"/>
      <rect x="14" y="124" width="44" height="16" rx="8"/>
      <rect x="0"  y="78"  width="16" height="48" rx="8"/>
      <rect x="0"  y="14"  width="16" height="48" rx="8"/>
    </g>
    <!-- Chiffre 2 : segments a, b, g, e, d -->
    <g id="d2">
      <rect x="14" y="0"   width="44" height="16" rx="8"/>
      <rect x="56" y="14"  width="16" height="48" rx="8"/>
      <rect x="14" y="62"  width="44" height="16" rx="8"/>
      <rect x="0"  y="78"  width="16" height="48" rx="8"/>
      <rect x="14" y="124" width="44" height="16" rx="8"/>
    </g>
  </defs>

  <!-- Fond noir -->
  <rect width="512" height="512" fill="#0b0b0c"/>

  <!-- Afficheur "00:20" centré (384 x 140 px, réduit à 90 %) -->
  <g transform="translate(256 256) scale(0.9) translate(-192 -70)">
    <use href="#d0" x="0"   fill="#3a3a40"/>   <!-- zéros de tête en gris sombre -->
    <use href="#d0" x="92"  fill="#3a3a40"/>
    <circle cx="192" cy="42" r="9" fill="#ef4444"/>  <!-- deux-points rouge : seule touche de couleur -->
    <circle cx="192" cy="98" r="9" fill="#ef4444"/>
    <use href="#d2" x="220" fill="#ffffff"/>
    <use href="#d0" x="312" fill="#ffffff"/>
  </g>
</svg>
